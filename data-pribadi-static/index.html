<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aplikasi Data Pribadi</title>
  <meta name="description" content="CRUD data pribadi: NIK, nama, jenis kelamin, tanggal lahir, alamat, dan negara." />
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body { background:#f5f7fa; }
    .table td, .table th { vertical-align: middle; }
    .truncate { max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .required::after { content:" *"; color:#dc3545; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Aplikasi Data Pribadi</span>
    </div>
  </nav>

  <div class="container my-4">
    <!-- Filter -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label class="form-label">NIK</label>
            <input type="text" id="searchNik" class="form-control" placeholder="Cari berdasarkan NIK" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Nama</label>
            <input type="text" id="searchNama" class="form-control" placeholder="Cari berdasarkan nama" />
          </div>
          <div class="col-md-4 d-flex gap-2">
            <button id="btnSearch" class="btn btn-primary"><i class="bi bi-search"></i> Search</button>
            <button id="btnReset" class="btn btn-outline-secondary">Reset</button>
            <button id="btnAdd" class="btn btn-success ms-auto"><i class="bi bi-plus-lg"></i> Add</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-dark">
            <tr>
              <th style="width:50px">No</th>
              <th>NIK</th>
              <th>Nama Lengkap</th>
              <th style="width:70px">Umur</th>
              <th>Tanggal Lahir</th>
              <th>Jenis Kelamin</th>
              <th>Alamat</th>
              <th>Negara</th>
              <th style="width:150px" class="text-end">Action</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Form Modal -->
  <div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="dataForm">
          <div class="modal-header">
            <h5 class="modal-title" id="formTitle">Tambah Data</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="mode" value="add" />
            <input type="hidden" id="originalNik" />

            <div class="mb-3">
              <label class="form-label required">NIK</label>
              <input type="text" id="nik" class="form-control" inputmode="numeric" placeholder="Contoh: 3201010101900001" />
              <div class="invalid-feedback" id="nikError"></div>
            </div>
            <div class="mb-3">
              <label class="form-label required">Nama Lengkap</label>
              <input type="text" id="namaLengkap" class="form-control" />
              <div class="invalid-feedback" id="namaError"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">Jenis Kelamin</label>
              <div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="jk" id="jkL" value="L" checked />
                  <label class="form-check-label" for="jkL">Laki-laki</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="jk" id="jkP" value="P" />
                  <label class="form-check-label" for="jkP">Perempuan</label>
                </div>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Tanggal Lahir</label>
              <input type="date" id="tanggalLahir" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Alamat</label>
              <textarea id="alamat" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Negara</label>
              <select id="negara" class="form-select"></select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" id="btnCancel">Batal</button>
            <button type="submit" class="btn btn-primary" id="btnSave">Simpan</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Konfirmasi Hapus</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          Anda yakin menghapus data <strong id="deleteName"></strong>?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-danger" id="btnConfirmDelete">OK</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast align-items-center text-bg-success border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastMsg"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <!-- jQuery + Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
